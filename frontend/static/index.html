<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore With Me</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
    <h1> Explore With Me</h1>
    <div class="user-badge">
        <span id="user-label">Вход…</span>
        <button id="user-reset" title="Войти как новый пользователь">↺ новый пользователь</button>
    </div>
</header>

<main>
    <section>
        <h2> Рекомендации для вас</h2>
        <div id="recommendations" class="grid"></div>
    </section>
    <section>
        <h2> Все мероприятия</h2>
        <div id="events" class="grid"></div>
    </section>
</main>

<div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div id="modal-body"></div>
    </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/js/app.js"></script>
</body>
</html>
