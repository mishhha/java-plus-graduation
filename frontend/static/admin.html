<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EWM — Админ-панель</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
    <div class="logo-row">
        <h1 class="glitch" data-text="EXPLORE WITH ME">EXPLORE WITH ME</h1>
        <span class="admin-tag">[admin mode]</span>
    </div>
    <div class="user-badge">
        <a class="admin-link" href="/index.html">← Афиша</a>
        <span id="admin-user-label"></span>
        <button id="admin-logout" type="button">⎋ Выйти</button>
    </div>
</header>

<main>
    <section id="section-admin">
        <div class="section-head">
            <h2>▦ Мероприятия</h2>
            <div class="admin-filters">
                <button type="button" class="filter-btn active" data-states="">Все</button>
                <button type="button" class="filter-btn" data-states="PENDING">PENDING</button>
                <button type="button" class="filter-btn" data-states="PUBLISHED">PUBLISHED</button>
                <button type="button" class="filter-btn" data-states="CANCELED">CANCELED</button>
            </div>
        </div>
        <div id="admin-events" class="grid"></div>
        <div class="pager">
            <button id="admin-prev" type="button">‹ Назад</button>
            <span id="admin-page">стр. 1</span>
            <button id="admin-next" type="button">Вперёд ›</button>
        </div>
    </section>
</main>

<div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-tabs">
            <button type="button" class="tab active" data-tab="details">◈ Детали</button>
            <button type="button" class="tab" data-tab="comments">// Комментарии</button>
        </div>
        <div id="tab-details" class="tab-content"></div>
        <div id="tab-comments" class="tab-content hidden"></div>
    </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/js/admin.js"></script>
</body>
</html>
