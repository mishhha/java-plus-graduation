spring:
  application:
    name: event-service
  config:
    import: "optional:configserver:http://config-server:8888"

  # 👈 ДОБАВЛЯЕМ ЯВНЫЕ НАСТРОЙКИ БАЗЫ ДАННЫХ
  datasource:
    url: jdbc:postgresql://ewm-db:5432/ewm
    username: ewm
    password: ewm
    driver-class-name: org.postgresql.Driver

  # 👈 ДОБАВЛЯЕМ ЯВНУЮ ИНСТРУКЦИЮ СОЗДАВАТЬ ТАБЛИЦЫ
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true # Чтобы мы видели в логах "create table"

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true