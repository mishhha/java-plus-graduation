server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: ewm-main-service-admin
          uri: lb://ewm-main-service
          predicates:
            - Path=/admin/**
        - id: ewm-main-service-users
          uri: lb://ewm-main-service
          predicates:
            - Path=/users/**
        - id: ewm-main-service-events
          uri: lb://ewm-main-service
          predicates:
            - Path=/events/**
        - id: ewm-main-service-categories
          uri: lb://ewm-main-service
          predicates:
            - Path=/categories/**
        - id: ewm-main-service-compilations
          uri: lb://ewm-main-service
          predicates:
            - Path=/compilations/**