server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:ewm;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
  jpa:
    defer-datasource-initialization: true
  sql:
    init:
      data-locations: classpath:dataForTestEventsH2.sql
  h2:
    console:
      enabled: true
      path: /h2-console

stats-service:
  id: ewm-stats-server