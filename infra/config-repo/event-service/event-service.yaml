server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://ewm-db:5432/ewm
    username: ewm
    password: ewm
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  sql:
    init:
      mode: always

grpc:
  client:
    collector-service:
      address: 'discovery:///collector-service'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
    analyzer-service:
      address: 'discovery:///analyzer-service'
      enableKeepAlive: true
      keepAliveWithoutCalls: true