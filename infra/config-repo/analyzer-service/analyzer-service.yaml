grpc:
  server:
    port: 0

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  datasource:
    url: jdbc:postgresql://stats-db:5432/ewm-stats
    username: stat
    password: stat
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: analyzer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: ru.practicum.config.AvroDeserializer
        spring.deserializer.value.type.mapping: >
          stats.user-actions.v1:ru.practicum.ewm.stats.avro.UserActionAvro,
          stats.events-similarity.v1:ru.practicum.ewm.stats.avro.EventSimilarityAvro