server:
  port: 0

spring:
  application:
    name: stats-server
  config:
    import: "optional:configserver:http://config-server:8888"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true