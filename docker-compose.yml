services:
  stats-db:
    image: postgres:16.1
    container_name: postgres-ewm-stats-db
    ports:
      - "6541:5432"
    environment:
      - POSTGRES_PASSWORD=stat
      - POSTGRES_USER=stat
      - POSTGRES_DB=ewm-stats
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  ewm-db:
    image: postgres:16.1
    container_name: postgres-ewm-main-db
    ports:
      - "6542:5432"
    environment:
      - POSTGRES_PASSWORD=ewm
      - POSTGRES_USER=ewm
      - POSTGRES_DB=ewm
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  discovery-server:
    build: infra/discovery-server
    image: discovery-server
    ports:
      - "8761:8761"

  config-server:
    build: infra/config-server
    image: config-server
    ports:
      - "8888:8888"
    depends_on:
      - discovery-server

  stats-server:
    build: stat/stat-server
    image: stats-server
    ports:
      - "9090:9090"
    depends_on:
      stats-db:
        condition: service_healthy
      config-server:
        condition: service_started
    environment:
      - EUREKA_URI=http://discovery-server:8761/eureka/
      - DB_URL=jdbc:postgresql://stats-db:5432/ewm-stats
      - DB_DRIVER=org.postgresql.Driver
      - POSTGRES_USER=stat
      - POSTGRES_PASSWORD=stat
      - JPA_DDL_AUTO=create
      - SQL_INIT_MODE=never

  ewm-service:
    build: core/main-service
    image: ewm-main-service
    ports:
      - "8081:8080"
    depends_on:
      ewm-db:
        condition: service_healthy
      config-server:
        condition: service_started
    environment:
      - EUREKA_URI=http://discovery-server:8761/eureka/
      - DB_URL=jdbc:postgresql://ewm-db:5432/ewm
      - DB_DRIVER=org.postgresql.Driver
      - POSTGRES_USER=ewm
      - POSTGRES_PASSWORD=ewm
      - JPA_DDL_AUTO=create
      - SQL_INIT_MODE=never

  gateway-server:
    build: infra/gateway-server
    image: gateway-server
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
      - config-server
    environment:
      - EUREKA_URI=http://discovery-server:8761/eureka/